[workspace]
members = [
    "core",
    "langs",
    "server",
    "solo-tui",
    "desktop",
]
resolver = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package.core]
opt-level = 2

[profile.dev.package.doux-sova]
opt-level = 2

[profile.dev.package.langs]
opt-level = 2

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.145"
crossbeam-channel = "0.5.15"
lalrpop-util = { version = "0.21.0", features = ["lexer", "unicode"] }
pest = "2.8.3"
pest_derive = "2.8.3"
tokio = "1.44.1"
rand = "0.9.0"
thread-priority = "1.2.0"

[patch."https://github.com/sova-org/sova"]
core = { path = "core" }

