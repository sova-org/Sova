name: Build macOS

on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: false
      run-clippy:
        type: boolean
        default: false
      build-packages:
        type: boolean
        default: false
      matrix:
        type: string
        default: '[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"sova-macos-aarch64"}]'
  workflow_dispatch:
    inputs:
      run-tests:
        type: boolean
        default: true
      run-clippy:
        type: boolean
        default: true
      build-packages:
        type: boolean
        default: false
      matrix:
        type: string
        default: '[{"os":"macos-14","target":"aarch64-apple-darwin","artifact":"sova-macos-aarch64"}]'

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Clone doux
        run: git clone https://github.com/Bubobubobubobubo/doux.git ../doux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: brew list cmake &>/dev/null || brew install cmake

      - name: Build server
        run: cargo build --release -p sova-server --target ${{ matrix.target }}

      - name: Build desktop
        run: cargo build --release -p sova-desktop --target ${{ matrix.target }}

      - name: Test
        if: inputs.run-tests
        run: cargo test --target ${{ matrix.target }}

      - name: Clippy
        if: inputs.run-clippy
        run: cargo clippy -p core -p langs -p sova-server -p sova-desktop --target ${{ matrix.target }} -- -D warnings

      - name: Bundle desktop app
        if: inputs.build-packages
        run: scripts/make-app-bundle.sh ${{ matrix.target }}

      - name: Zip macOS app bundle
        if: inputs.build-packages
        run: |
          cd target/${{ matrix.target }}/release/bundle/osx
          zip -r Sova.app.zip Sova.app

      - name: Upload server artifact
        if: inputs.build-packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/sova_server

      - name: Upload desktop artifact
        if: inputs.build-packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-desktop
          path: target/${{ matrix.target }}/release/bundle/osx/Sova.app.zip
