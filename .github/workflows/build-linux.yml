name: Build Linux

on:
  workflow_call:
    inputs:
      run-tests:
        type: boolean
        default: false
      run-clippy:
        type: boolean
        default: false
      build-packages:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      run-tests:
        type: boolean
        default: true
      run-clippy:
        type: boolean
        default: true
      build-packages:
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Clone doux
        run: git clone https://github.com/Bubobubobubobubo/doux.git ../doux

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-gnu

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libclang-dev libjack-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev

      - name: Build server
        run: cargo build --release -p sova-server --target x86_64-unknown-linux-gnu

      - name: Build desktop
        run: cargo build --release -p sova-desktop --target x86_64-unknown-linux-gnu

      - name: Test
        if: inputs.run-tests
        run: cargo test --target x86_64-unknown-linux-gnu

      - name: Clippy
        if: inputs.run-clippy
        run: cargo clippy -p core -p langs -p sova-server -p sova-desktop --target x86_64-unknown-linux-gnu -- -D warnings

      - name: Upload server artifact
        if: inputs.build-packages
        uses: actions/upload-artifact@v4
        with:
          name: sova-linux-x86_64
          path: target/x86_64-unknown-linux-gnu/release/sova_server

      - name: Upload desktop artifact
        if: inputs.build-packages
        uses: actions/upload-artifact@v4
        with:
          name: sova-linux-x86_64-desktop
          path: target/x86_64-unknown-linux-gnu/release/sova-frontend
