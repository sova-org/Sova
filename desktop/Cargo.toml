[package]
name = "sova-desktop"
version.workspace = true
edition = "2024"
publish = false

[[bin]]
name = "sova-frontend"
path = "src/main.rs"

[features]
default = ["default-samples", "default-soundfont"]
default-samples = ["sova_server/default-samples"]
default-soundfont = ["sova_server/default-soundfont"]
asio = ["doux/asio", "sova_server/asio"]

[dependencies]
eframe = "0.33.3"
sova_server = { path = "../server", package = "sova-server", features = ["audio"] }
sova_core = { path = "../core", package = "core" }
langs = { path = "../langs" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "macros"] }
crossbeam-channel = { workspace = true }
egui_extras = { version = "0.33", default-features = false, features = ["image"] }
egui-file-dialog = "0.12"
serde = { workspace = true }
serde_json = { workspace = true }
confy = "2"
doux = { git = "https://github.com/sova-org/doux", tag = "v0.0.35", features = ["native"] }
rustfft = "6"
libc = "0.2"
egui_commonmark = { version = "0.22", default-features = false }
rust-i18n = "3"
regex = "1"
hydra-rust = { git = "https://github.com/sova-org/hydra-rust" }
font-kit = "0.14.3"
ab_glyph = "0.2"
egui-phosphor = { version = "0.11", default-features = false, features = ["fill"] }
tokio-util = "0.7.18"
loro = { workspace = true }

[build-dependencies]
winresource = "0.1"
