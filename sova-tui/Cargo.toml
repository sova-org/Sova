[package]
name = "sova-tui"
version = "0.1.0"
description = "An example generated using the event-driven template"
authors = ["TanguyDubois <dubois.tanguy@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"]}
ratatui = "0.30.2"
color-eyre = "0.6.5"
tui-big-text = "0.8.9"
tui-checkbox = "0.4.6"
sova_core = { path = "../core", package = "core" }
sova_server = { path = "../server", package = "sova-server", features = ["audio"] }
langs = { path = "../langs", package = "langs" }
doux-sova = { git = "https://github.com/sova-org/doux", tag = "v0.0.35", package = "doux-sova", optional = true }
arboard = "3.6.1"
ratatui-textarea = "0.9.2"
tui-menu = "0.3.1"
tachyonfx = "0.25.2"
nerd-font-symbols = "0.3.0"
ratatui-themes = "0.3.0"
tokio = { workspace = true, features = ["full"] }
futures = "0.3.34"
tokio-util.workspace = true

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
